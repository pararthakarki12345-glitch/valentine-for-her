<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine?</title>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<!-- Confetti Library -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
    body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
        text-align: center;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    }

    h1 {
        margin-top: 100px;
        font-size: 2.5em;
        color: white;
        position: relative;
        z-index: 2;
    }

    .buttons {
        margin-top: 40px;
        position: relative;
        z-index: 2;
    }

    button {
        padding: 15px 30px;
        font-size: 20px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        position: absolute;
        transition: all 0.3s ease;
    }

    #yesBtn {
        background-color: #ff4d6d;
        color: white;
        left: 40%;
    }

    #noBtn {
        background-color: #444;
        color: white;
        left: 55%;
    }

    #message {
        margin-top: 40px;
        font-size: 2em;
        color: white;
        display: none;
        position: relative;
        z-index: 2;
    }

    .heart {
        position: absolute;
        bottom: -50px;
        font-size: 24px;
        animation: floatUp linear infinite;
        opacity: 0.8;
    }

    @keyframes floatUp {
        0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
        100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }
</style>
</head>

<body>

<h1>Will you be my Valentine? ❤️</h1>

<div class="buttons">
    <button id="yesBtn">Yes 💖</button>
    <button id="noBtn">No 😢</button>
</div>

<div id="message">YAY!! I love you so much ❤️🥰</div>

<!-- Romantic Music -->
<audio id="romanticMusic" src="romantic.mp3"></audio>

<script>
/* ---------------- EMAILJS INIT ---------------- */
(function(){
    emailjs.init("fPiCm3Srhr3xcHjbQ"); // ← EmailJS Puclic Key
})();

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const message = document.getElementById("message");
const music = document.getElementById("romanticMusic");

/* ---------------- NO BUTTON RUNS AWAY ---------------- */
noBtn.addEventListener("mouseover", function() {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 100);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

/* ---------------- YES BUTTON CLICK ---------------- */
yesBtn.addEventListener("click", function() {

    // 🎵 Play music
    music.play();

    // 🎉 Confetti Explosion
    confetti({
        particleCount: 200,
        spread: 120,
        origin: { y: 0.6 }
    });

    // 💌 Send Email
    emailjs.send("service_0m5uw3o", "service_0m5uw3o", {
        to_email: "pararthakarki12345@gmail.com",
        message: "She said YES! 💖🥰"
    }).then(function(response) {
        console.log("Email sent!", response.status);
    }, function(error) {
        console.log("Email failed...", error);
    });

    document.querySelector(".buttons").style.display = "none";
    message.style.display = "block";
});

/* ---------------- FLOATING HEARTS ---------------- */
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 20) + "px";
    heart.style.animationDuration = (Math.random() * 3 + 3) + "s";

    document.body.appendChild(heart);

    setTimeout(() => { heart.remove(); }, 6000);
}

setInterval(createHeart, 300);

</script>

</body>
</html>
